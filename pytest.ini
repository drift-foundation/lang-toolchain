[pytest]
norecursedirs = .git .venv build staged lang/tests/memcheck
markers =
    heavy: long-running test; scheduled first under xdist to avoid long-tail stragglers
    perf: native-mode wall-clock perf gate; MUST run serially on an idle host (excluded from the parallel `lang-driver-test` xdist lane, executed by `just perf-protocols`)
    ledger_3c_acceptance: tag for the Phase 3C acceptance regressions (bucket-6 carrier shapes). They run in the default suite now that Phase 3C runtime drop-flag insertion (`lang/driftc/stage2/drop_flags.py`) has landed and turned them passing. The tag remains for targeted invocation: `pytest -m ledger_3c_acceptance` runs only these to confirm the bucket-6 acceptance contract.
